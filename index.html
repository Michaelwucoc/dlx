<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWMC</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://s.awmc.team/script.js" data-website-id="5dea46be-2bc7-434f-8f73-7fdaf5440554" data-performance="true"></script>
  <script defer src="https://s.awmc.team/recorder.js" data-website-id="5dea46be-2bc7-434f-8f73-7fdaf5440554"></script>
</head>
<body>
  <main class="stage">
    <button type="button" class="trigger" id="trigger" aria-label="随机播放声音">
      <img src="images/01.jpg" alt="AWMC" class="center-image" id="centerImage">
      <img src="images/03.png" alt="Overlay" class="overlay-image" id="overlayImage">
    </button>
    <p class="hint">点击或按空格键播放随机音效</p>
    <p class="counter">全网累计殴打迪拉熊 <span id="clickCount">258000</span> 次</p>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <a class="game-link" href="https://v.wmc.pub/" target="_blank" rel="noopener noreferrer">
        <span class="game-link-label">我们开发了新的游戏！</span>
        <strong>你画我猜！一起来玩！</strong>
      </a>
      <a class="qq-link" href="https://qm.qq.com/q/uhWVWupYOs" target="_blank" rel="noopener noreferrer">
        加入 QQ 群 <strong>1048450426</strong>
      </a>
      <p class="credit">AWMC TEAM 制作</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
